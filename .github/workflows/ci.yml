name: CI for CreateCustomer 🚀

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 📦
      uses: actions/checkout@v3

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub 🔐
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Usar el nombre de usuario de Docker Hub
        password: ${{ secrets.DOCKER_PASSWORD }}  # Usar el token de acceso de Docker Hub

    - name: Build Docker image 🔨
      run: |
        docker build -t erickuce/projectawsstore-createcustomer:latest .

    - name: Push Docker image to Docker Hub 🌍
      run: |
        docker push erickuce/projectawsstore-createcustomer:latest

    - name: Add EC2 host to known_hosts 🌐
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        chmod 700 ~/.ssh
        chmod 644 ~/.ssh/known_hosts

    - name: Deploy to EC2 (Optional) 🌐
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # Guardar la clave privada en un archivo temporal y establecer permisos
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key.pem  # Quitar saltos de línea adicionales
        chmod 600 private_key.pem
        # Asegurarse de que la clave se maneje correctamente para la conexión SSH
        ssh -T -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
          docker pull erickuce/projectawsstore-createcustomer:latest
          docker run -d -p 8081:8081 erickuce/projectawsstore-createcustomer:latest
        EOF
