name: CI for DeleteCustomer 🚀

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 📦
      uses: actions/checkout@v3

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub 🔐
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Usar el nombre de usuario
        password: ${{ secrets.DOCKER_PASSWORD }}  # Usar la contraseña (sin token)

    - name: Build Docker image 🔨
      run: |
        sudo docker build -t erickuce/projectawsstore-deletecustomer:latest .

    - name: Push Docker image to Docker Hub 🌍
      run: |
        for i in {1..3}; do
          docker push erickuce/projectawsstore-deletecustomer:latest && break || sleep 20;
        done

    - name: Add EC2 host to known_hosts 🌐
      run: |
        # Verificar si el directorio ~/.ssh ya existe, si no, crearlo
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Añadir la clave del host EC2
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Deploy to EC2 (Optional) 🌐
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # Guardar la clave privada en un archivo temporal y establecer permisos
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key.pem  # Quitar saltos de línea adicionales
        chmod 600 private_key.pem
        # Asegurarse de que la clave se maneje correctamente para la conexión SSH
        ssh -T -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
          sudo docker pull erickuce/projectawsstore-deletecustomer:latest
          sudo docker run -d -p 8084:8084 erickuce/projectawsstore-deletecustomer:latest
        EOF
